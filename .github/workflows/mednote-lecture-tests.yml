name: MedNote Lecture Regression
on:
  push:
    branches:
      - codex/integrated-study-workspace
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: pip install -r requirements.txt 'pymupdf>=1.24,<2'
      - name: Python course and AI gateway tests
        run: for name in test_course_workflow test_large_lecture_workflow test_lecture_jobs test_lecture_journey test_study_integration; do PYTHONPATH=. python -m unittest discover -s tests -p "$name.py" -v || exit 1; done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Render medical atlas pages and validate structural layouts
        run: node --test tests/medical-atlas-render.test.mjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
